<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efe6d8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161310" />
    <title>Offline · Path of Pain</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #efe6d8;
        --foreground: #1a1612;
        --panel: #fffcf7;
        --line: #ddd2c4;
        --muted: #6b6158;
        --accent: #c2410c;
        --shadow-soft: rgba(61, 39, 24, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #161310;
          --foreground: #f3ece3;
          --panel: #221e1a;
          --line: #3a332c;
          --muted: #b4a89c;
          --accent: #ea580c;
          --shadow-soft: rgba(0, 0, 0, 0.34);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 1rem) 1rem
          calc(env(safe-area-inset-bottom) + 1rem);
        background:
          linear-gradient(rgba(194, 65, 12, 0.07) 1px, transparent 1px),
          radial-gradient(circle, rgba(94, 63, 36, 0.08) 0 1px, transparent 1.5px),
          var(--background);
        background-size: 100% 34px, 18px 18px, auto;
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        width: min(28rem, 100%);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 1.5rem;
        box-shadow: 0 24px 70px -42px var(--shadow-soft);
      }
      .mark {
        display: block;
        width: 2.75rem;
        height: 2.75rem;
        color: var(--foreground);
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.35rem;
      }
      p {
        color: var(--muted);
        line-height: 1.65;
        margin: 0.5rem 0 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.75rem;
        margin-top: 1.25rem;
        padding: 0 1rem;
        border-radius: 10px;
        background: var(--accent);
        color: #fff7ed;
        font-weight: 650;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="74 74 364 364" fill="none" aria-hidden="true">
        <g transform="translate(0 -6)">
          <path
            d="M108 404 L200 404 L200 316 L292 316 L292 228 L384 228"
            stroke="currentColor"
            stroke-width="44"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="384" cy="140" r="42" fill="var(--accent)" />
        </g>
      </svg>
      <h1>Offline</h1>
      <p>
        The trail is still here, but the private records stay uncached. Reconnect
        to read or change applications.
      </p>
      <a href="/applications">Try the trail again</a>
    </main>
  </body>
</html>
